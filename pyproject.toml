[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "napa-x4-pi"
version = "0.2.0"
description = "AprilTags from an Insta360 X4's 360-degree webcam stream on a Raspberry Pi, with NAPA"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "napa-vision>=0.6.1,<1",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<6",
]

[project.optional-dependencies]
nt = ["pyntcore>=2026.2.2,<2027"]  # each season's pyntcore is a new major version: check it, then raise this
test = ["pytest>=8"]
lint = ["ruff>=0.17"]

[project.scripts]
x4tags = "x4tags.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF005"]  # suggests [*a, b] for a + [b], but most of these are numpy arrays, where + adds

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["x4tags.mount.Mount", "Mount"]  # a frozen dataclass
