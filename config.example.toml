# x4tags settings. Copy to /etc/x4tags.toml (the service reads it) and edit. Every key is optional.

[camera]
# device = "/dev/video0"     # default: find the X4 by its USB vendor ID
mode = "equirect"            # or "dual1080": 1920x1080 front/back views, sharper and ~20 ms faster, but blind
                             # 28 degrees each side and beyond +-24 degrees up/down (see README)
# width = 2880               # default: the mode's size
# height = 1440
fps = 30
reduce = 1                   # 2 = decode at half size (1440x720): cheaper, halves the range
reconnect_s = 2.0
# latency_ms = 135.0         # camera -> Pi delay (stitch, encode, USB), subtracted from timestamps; default: measured
                             # on one X4, 135 for "equirect" and 112 for "dual1080"; check yours with check_latency

[detector]
min_tag_px = 16              # smallest tag side (pixels) NAPA looks for; 22 (NAPA's default) misses far tags
threads = 1                  # NAPA threads per search; on a Pi 5 more don't help (2 save ~0.6 ms in dual1080)
refine_bow_px = 0.2          # refine tags the 360 frame bends more than this ("none" = never)
seam_px = 192                # search this far either side of the left/right seam (0 = don't)
near_scale = 0.3333          # straight low-res views for close tags the 360 frame bends too much (0 = off)
near_per_frame = 2           # of the 12 straight views, search this many per frame in rotation (0 = all)
# family = "tag36h11"
# extra = { recover_shadows = true }   # any other NapaDetector option

[tags]
size_m = 0.1651              # black-square side (FRC: 6.5 in); "none" = bearings only, no pose
max_pose_error_px = 4.0
# ids = [1, 2, 3]            # only report these

[mount]                      # camera on the robot, WPILib robot frame (x forward, y left, z up)
x_m = 0.0
y_m = 0.0
z_m = 0.5
roll_deg = 0.0
pitch_deg = 0.0              # + tips the camera's forward view down
yaw_deg = 0.0                # + turns it left; 0 = picture middle looks along robot +x

[field]
# layout = "/etc/x4tags-field.json"   # WPILib AprilTag field layout: adds a field pose from all visible tags
max_rms_px = 1.5             # every tag in the field pose must fit within this; badly fitting tags are left out
min_tags = 2                 # one tag alone gives an ambiguous pose (two fits, metres apart): keep this >= 2
corner_noise_px = 0.5        # assumed corner error, for the covariances published with each pose
max_xy_std_m = 1.0           # no pose when its expected position error is larger than this

[output]
print = false                # JSON line per frame on stdout
# udp = "10.12.34.2:5800"    # JSON datagram per frame
# nt_server = 1234           # NetworkTables 4: team number, or a host ("10.12.34.2", "localhost:5810")
nt_table = "x4tags"
stats_every_s = 10.0
